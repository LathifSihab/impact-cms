<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Transcribed from the static pages' own head script: `.js` is what the
         stylesheet keys reveal-on-scroll off, and marking the preloader as seen
         is what the site itself does, so it does not run here either. */
      (function (d) {
        d.documentElement.classList.add('js');
        try { sessionStorage.setItem('hasSeenPreloader', '1'); } catch (e) {}
      })(document);
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- No display:contents wrapper: main.js makes the page inert while the
         newsletter dome is open by marking every child of <body> except the
         dome, and a wrapper would contain the dome too. -->
    %sveltekit.body%
  </body>
</html>
