<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* The static pages' own boot script, transcribed.
         
         It runs before first paint, which is the point: `.js` is what the
         stylesheet keys the reveal-on-scroll start state off, and the decision
         to run the preloader cannot wait for a deferred script — by then the
         page has been painted and the curtain would drop over content the
         visitor has already seen.

         The backoffice is excluded. It shares this shell but has no preloader
         markup, so `is-preloading` there would only lock the scroll until the
         failsafe fires. */
      (function (d) {
        var h = d.documentElement;
        h.classList.add('js');

        var p = location.pathname;
        if (p === '/admin' || p.indexOf('/admin/') === 0 || p.indexOf('/login') === 0) return;

        try {
          var seen = sessionStorage.getItem('hasSeenPreloader');
          sessionStorage.setItem('hasSeenPreloader', '1');
          if (!seen) {
            h.classList.add('is-preloading');
            /* If GSAP or preloader.js never arrives, the visitor is left looking
               at a black screen with the scroll locked. This is the one
               guarantee that cannot depend on either of them loading. */
            window.__preFailsafe = setTimeout(function () {
              h.classList.remove('is-preloading');
            }, 3000);
          }
        } catch (e) {
          /* storage blocked: no preloader, and nothing breaks */
        }
      })(document);
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- No display:contents wrapper: main.js makes the page inert while the
         newsletter dome is open by marking every child of <body> except the
         dome, and a wrapper would contain the dome too. -->
    %sveltekit.body%
  </body>
</html>
